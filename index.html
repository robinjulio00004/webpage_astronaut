<!DOCTYPE html>
<html>
	<head>
    <script src="./code/aframe-v1.6.0.min.js"></script>
    <script src="./code/aframe-ar.js"></script>
	<script src="./code/aframe-extras.js"></script>
	</head>

    <body style="margin : 0px; overflow: hidden;">
        <a-scene embedded arjs>
           <a-marker type="pattern" url="./target/number_43.patt">
		<a-entity gltf-model="./models/astronaut_motion.glb" scale="0.5 0.5 0.5" position="0 1 0" rotation="-90 0 0" 
			animation-mixer="clip: moon_walk; timeScale:1;"></a-entity>
		<a-entity gltf-model="./models/astronaut_motion.glb" scale="0.5 0.5 0.5" position="-1 0 0" rotation="-90 0 0" 
			animation-mixer="clip: moon_floating; timeScale:1;"></a-entity>
		<a-entity gltf-model="./models/astronaut_motion.glb" scale="0.5 0.5 0.5" position="1 0 0" rotation="-90 0 0" 
			animation-mixer="clip: wave; timeScale:1;"></a-entity>
		<a-entity gltf-model="./models/astronaut_motion.glb" scale="0.5 0.5 0.5" position="0 -1 0" rotation="-90 0 0" 
			animation-mixer="clip: idle; timeScale:1;"></a-entity>
             
	   </a-marker> 
	  <a-entity camera position="0 0 6"></a-entity>      
        </a-scene>
    </body>
</html>
